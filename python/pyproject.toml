[project]
name = "librpc"
version = "0.1.0"
description = "librpc client for Python: RPC over WebSocket for services written in libbufs schemas"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["bufs"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["librpc"]
